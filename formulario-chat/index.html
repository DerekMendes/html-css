<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
  <section aria-labelledby="titulo-cadastro">
    
    <h1 id="titulo-cadastro">Criar Conta</h1>

    <form action="/cadastro" method="post" novalidate>

      <!-- Dados pessoais -->
      <fieldset>
        <legend>Dados pessoais</legend>

        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input 
            type="text" 
            id="nome" 
            name="nome" 
            required 
            minlength="3"
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input 
            type="tel" 
            id="telefone" 
            name="telefone"
            pattern="[0-9]{9,11}"
            autocomplete="tel"
          >
        </div>

      </fieldset>

      <!-- Segurança -->
      <fieldset>
        <legend>Segurança</legend>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input 
            type="password" 
            id="senha" 
            name="senha"
            required
            minlength="6"
          >
        </div>

        <div class="form-group">
          <label for="confirmar-senha">Confirmar senha</label>
          <input 
            type="password" 
            id="confirmar-senha" 
            name="confirmar_senha"
            required
          >
        </div>

      </fieldset>

      <!-- Preferências -->
      <fieldset>
        <legend>Preferências</legend>

        <div class="form-group">
          <span>Gênero</span>

          <label>
            <input type="radio" name="genero" value="masculino">
            Masculino
          </label>

          <label>
            <input type="radio" name="genero" value="feminino">
            Feminino
          </label>

          <label>
            <input type="radio" name="genero" value="outro">
            Outro
          </label>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" name="newsletter">
            Quero receber ofertas por email
          </label>
        </div>

      </fieldset>

      <div class="form-actions">
        <button type="submit">Criar conta</button>
        <button type="reset" class="secondary">Limpar</button>
      </div>

    </form>
  </section>
</main>

</body>
</html>
