<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>airbnb Alojametos para férias</title>
    <link rel="stylesheet" href="Estilo/style.css">
    <script src="https://kit.fontawesome.com/4339b883bd.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div id="first-bar">
            <div id="logo"><a href="#logo"><i class="fa-brands fa-airbnb"></i><h1>airbnb</h1></a></div>
                <div id="itens">
                    <div class="item">
                    <i class="fa-regular fa-house"></i>
                    <p>Alojamentos</p>
                    </div>
                    <div class="item">
                    <i class="fa-solid fa-helicopter"></i>
                    <p>Experiências</p>
                    </div>
                    <div class="item">
                    <i class="fa-solid fa-bell-concierge"></i>
                    Serviços
                </div>
            </div>
            <nav>
                <h2>Torne-se um anfitrião</h2>
                <i class="fa-solid fa-globe"></i>
                <i class="fa-solid fa-bars"></i>
            </nav>
        </div>
        <div id="pesquisa">
            <div class="pesquisa-cor">
               <form action="cadastro" class="preencher">
                    <label for="onde">Onde</label>
                    <input type="text" placeholder="Pesquisar destinos">
               </form>
            </div>
            <div class="pesquisa-cor">
               <form action="cadastro" class="preencher">
                    <label for="Check-in">Check-in</label>
                    <input type="month" placeholder="Adicionar data">
               </form>
            </div>
            <div class="pesquisa-cor">
               <form action="cadastro" class="preencher">
                    <label for="Check-out">Check-out</label>
                    <input type="month" placeholder="Adicionar data">
               </form>
            </div>
            <div class="pesquisa-cor">
               <form action="cadastro" class="preencher">
                    <label for="Quem">Quem</label>
                    <input type="text" placeholder="Adicionar vianjante">
               </form>
            </div>
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>   
    </header>
    <main>

    </main>
</body>
</html>
