<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquina</title>
    <script src="https://kit.fontawesome.com/4339b883bd.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="mensagens">
                <i class="fa-solid fa-check check"></i>
                <p>Há 2 mensagens</p>
                <i class="fa-solid fa-angle-down ultimo"></i>
            </div>

            <div class="controles">
                <div class="item-controles">
                    <i class="fa-solid fa-eye"></i>
                    <p>15</p>
                </div>
                <div class="item-controles">
                    <i class="fa-solid fa-temperature-arrow-down"></i>
                    <p>15</p>
                </div>
                <div class="item-controles">
                    <i class="fa-solid fa-barcode"></i>
                    <p>15</p>
                </div>
                <div class="item-controles">
                    <i class="fa-brands fa-debian"></i>
                    <p>15</p>
                </div>
            </div>

            <div class="ajustes ultimo">
                <div class="item-ultimo">
                    <i class="fa-solid fa-wifi"></i>
                </div>
                <div class="item-ultimo">
                    <i class="fa-solid fa-stopwatch"></i>
                </div>
                <div class="item-ultimo">
                    <i class="fa-solid fa-question"></i>
                </div>
                <div class="item-ultimo">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="item-ultimo">
                    <i class="fa-solid fa-user-shield"></i>
                </div>     
            </div>

            <div class="linha-vertical"></div>

            <div class="horario">
                <i class="fa-solid fa-clock"></i>
                <p>10:17</p>
            </div>
            
        </nav>
    </header>
    <main class="container">
        <nav class="nav-main">
            <div><i class="fa-solid fa-envelope"></i></div>
            <div class="ultimo">
                <i class="fa-solid fa-stop"></i>
                <p>Stop</p>
            </div>
            <div>
                <i class="fa-solid fa-play"></i>
                <p>Start</p>
            </div>
            <div>
                Update
            </div>
        </nav>

        <section class="peca">
            <div class="peca-superior">
                <h2>Orla 1mm egger</h2>
                <i class="fa-solid fa-pen-to-square"></i>
            </div>
            <div class="imagem"><img src="imagem/peca.png" alt="ilustracao-peca"></div>
            <div class="especificacoes">
                <p><span>Orla:</span> ABS R1</p>
                <p><span>Expessura painel:</span> 19mm</p>
            </div>
            <div class="estatisticas">
                <div class="item-estatistica">
                    <span>Peças feitas<br><p>134917</p></span>
                    <i class="fa-solid fa-arrows-rotate"></i>
                </div>
                <div class="item-estatistica">
                    <span>Peças feitas<br><p>134917</p></span>
                    <i class="fa-solid fa-arrows-rotate"></i>
                </div>
            </div>
        </section>

        <section class="gerais">
            <h2>Gerais</h2>
            <div class="config-gerais">
                <div class="item-gerais">
                    <p>Velocidade</p>
                    <input type="text" class="ultimo">
                    <p>m/min</p>
                </div>
            </div>

        </section>
    </main>
</body>
</html>
